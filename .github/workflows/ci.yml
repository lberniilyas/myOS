# Runs on every push and pull request, so a change that breaks something is caught before
# Vercel deploys it. To make Vercel wait for these checks, see the README ("Deploy on Vercel").
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: personal_os
          POSTGRES_PASSWORD: personal_os
          POSTGRES_DB: personal_os_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U personal_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://personal_os:personal_os@localhost:5432/personal_os_test
      AI_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Formatting
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest
      - name: Migrations match the models and go down and up cleanly
        env:
          DATABASE_URL: postgresql+psycopg://personal_os:personal_os@localhost:5432/personal_os_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Type-check and build
        run: npm run build
